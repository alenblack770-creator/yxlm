qu<!DOCTYPE html>
<html lang="zh-CN" data-theme="hextech">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>海克斯科技 · 数据中枢</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
:root {
    --bg: #07080f;
    --bg2: #0a0c18;
    --card: rgba(20, 22, 36, 0.92);
    --card-solid: #141624;
    --card-hover: rgba(25, 28, 48, 0.95);
    --border: #2e3140;
    --border-glow: rgba(200, 155, 60, 0.2);
    --text: #e9eaf0;
    --text2: #9da3b8;
    --muted: #565c78;
    --gold: #f0a400;
    --gold-light: #ffd166;
    --tech: #0ac8b8;
    --tech-glow: rgba(10, 200, 184, 0.25);
    --magic: #c89b3c;
    --magic-glow: rgba(200, 155, 60, 0.3);
    --red: #e84057;
    --blue: #3b82f6;
    --font: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
    --font-title: 'Impact', 'PingFang SC', -apple-system, sans-serif;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --radius: 10px;
    --radius-sm: 6px;
    --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(200, 155, 60, 0.05);
}

/* ==================== 全体动画定义 ==================== */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
@keyframes glow-pulse {
    0%, 100% { box-shadow: 0 0 8px var(--gold); }
    50% { box-shadow: 0 0 24px var(--gold), 0 0 48px rgba(200, 155, 60, 0.2); }
}
@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: radial-gradient(circle at 20% 10%, rgba(60, 140, 254, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(200, 155, 60, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #3e4a60; border-radius: 3px; }

        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10, 11, 18, 0.9); backdrop-filter: blur(12px);

        .nav-left { display: flex; align-items: center; gap: 24px; }

            text-transform: uppercase; color: #b4cbd9;
            font-family: var(--font-title);
        }
        .nav-brand .logo {
            width: 32px; height: 32px;
            background: linear-gradient(145deg, #1f2235, #0e0f1a);
            border: 1px solid var(--magic); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: var(--gold);
        }
        .nav-links { display: flex; gap: 2px; flex-wrap: wrap; }

        }

        }
        .detail-content { position: relative; z-index: 1; padding: 20px; }
        .hero-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .hero-icon {

        .skill-item {

            cursor: pointer; box-shadow: 0 0 8px var(--gold);
            transition: transform 0.2s;
        }
        .map-marker:hover { transform: translate(-50%, -50%) scale(1.3); }
                .map-container {
            position: relative; width: 100%; max-width: 900px; margin: 0 auto;
            background-size: cover; background-position: center;
            border: 2px solid var(--magic); border-radius: 8px;
            aspect-ratio: 16/9;

            border: 1px solid rgba(255, 215, 0, 0.16);
            color: var(--gold); font-size: 0.78rem; font-weight: 700;
            letter-spacing: 0.02em; white-space: nowrap;
            pointer-events: none; box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .map-lane { color: var(--tech); }
        .map-neutral { color: var(--magic); }
        .map-marker {
            position: absolute; width: 18px; height: 18px;
            border-radius: 50%; transform: translate(-50%, -50%);
            cursor: pointer; box-shadow: 0 0 12px rgba(255, 193, 7, 0.35);
            border: 2px solid rgba(0,0,0,0.65);
            display: grid; place-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
            color: #fff;
        }
        .map-marker:hover { transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 0 18px rgba(255, 193, 7, 0.55); }
        .map-marker::after { content: attr(data-icon); font-size: 0.85rem; line-height: 1; }
        .marker-buff { background: rgba(59, 130, 246, 0.95); border-color: rgba(14, 165, 233, 0.9); }
        .marker-objective { background: rgba(232, 72, 87, 0.95); border-color: rgba(191, 45, 59, 0.9); }
        .marker-crab { background: rgba(168, 85, 247, 0.95); border-color: rgba(124, 58, 237, 0.9); }

        .map-legend { margin: 18px auto 0; max-width: 900px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .map-legend-item { display: flex; align-items: center; gap: 8px; background: rgba(10, 12, 24, 0.9); border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px; color: var(--text2); font-size: 0.85rem; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px rgba(255,255,255,0.08); }

        @media (max-width: 700px) { .map-legend { flex-direction: column; align-items: stretch; } }

        <div class="modal-box">
            <span class="modal-close" id="closeLogin">✕</span>
            <h3 style="color:var(--gold);margin-bottom:14px;">🔐 召唤师登录</h3>
            <input type="text" id="loginId" class="search-box" style="width:100%;" placeholder="ID (至少2字符)">
            <input type="password" id="loginPw" class="search-box" style="width:100%;" placeholder="密码 (至少6字符)">
            <button id="loginSubmit" class="btn-submit" style="width:100%;margin-top:8px;">登录</button>
            <div id="loginError" style="color:var(--red);font-size:0.75rem;margin-top:6px;"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="footer">© 2024 海克斯科技数据中枢 · 荣耀归于召唤师</div>

    <script>
        (function() {
            // ==================== 全局工具函数 ====================
            const toast = document.getElementById('toast');
            let tt;
            const showToast = m => {
                clearTimeout(tt);
                toast.textContent = m;
                toast.classList.add('show');
                tt = setTimeout(() => toast.classList.remove('show'), 2000);
            };
            const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
            const stripHtml = html => {
                const d = document.createElement('div');
                d.innerHTML = html;
                return d.textContent || d.innerText || '';
            };

            // ==================== Data Dragon：自动识别最新游戏版本（versions.json 首项） ====================
            const DATA_DRAGON_FALLBACK_VERSION = '15.1.1';
            let dataDragonVersion = null;

            async function fetchUrlWithCorsFallback(url) {
                const okRes = async (r) => {
                    if (!r || !r.ok) throw new Error(r ? String(r.status) : 'no response');
                    return r;
                };
                try {
                    return await okRes(await fetch(url));
                } catch (e1) {
                    try {
                        return await okRes(await fetch('https://corsproxy.io/?' + encodeURIComponent(url)));
                    } catch (e2) {
                        return await okRes(await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)));
                    }
                }
            }

            async function resolveLatestDataDragonVersion() {
                dataDragonVersion = null;
                try {
                    const res = await fetchUrlWithCorsFallback('https://ddragon.leagueoflegends.com/api/versions.json');
                    const arr = await res.json();
                    if (Array.isArray(arr) && arr.length && typeof arr[0] === 'string') {
                        dataDragonVersion = arr[0];
                    }
                } catch (e) {
                    console.warn('Data Dragon versions.json 获取失败，将使用默认版本号', e);
                }
            }

            function getDataDragonVersion() {
                return dataDragonVersion || DATA_DRAGON_FALLBACK_VERSION;
            }

            /** 从 champion.json / item.json 根字段同步版本（供国内等无法访问 Riot 时的本地数据） */
            function setDataDragonVersion(v) {
                if (v && typeof v === 'string') dataDragonVersion = v;
            }

            // ==================== 用户登录状态管理 ====================
            let currentUser = JSON.parse(localStorage.getItem('hex_user') || 'null');
            const updateNav = () => {
                const area = document.getElementById('navUserArea');
                if (currentUser) {
                    area.innerHTML = `<div class="user-menu">
                        <button class="user-toggle">👤 ${esc(currentUser.name)}</button>
                        <div class="logout-dropdown" id="logoutDD">
                            <button class="logout-btn" id="logoutBtn">退出</button>
                        </div>
                    </div>`;
                    document.querySelector('.user-toggle').addEventListener('click', () => {
                        document.getElementById('logoutDD').classList.toggle('show');
                    });
                    document.getElementById('logoutBtn').addEventListener('click', () => {
                        currentUser = null;
                        localStorage.removeItem('hex_user');
                        updateNav();
                        showToast('已退出');
                    });
                } else {
                    area.innerHTML = '<button class="login-btn" id="loginBtn">👤 登录</button>';
                    document.getElementById('loginBtn').addEventListener('click', () => {
                        document.getElementById('loginModal').style.display = 'flex';
                    });
                }
            };
            updateNav();

            document.getElementById('closeLogin').onclick = () => {
                document.getElementById('loginModal').style.display = 'none';
            };
            document.getElementById('loginSubmit').onclick = () => {
                const id = document.getElementById('loginId').value.trim();

    /** 总表 champion.json 无 spells/skins 时，按需拉取单英雄 JSON（与官方 Data Dragon 现行结构一致） */
    async function enrichChampionFromDetailJson(hr) {
        if (hr._ddragonDetailLoaded || !hr.id) return;
        const applyFull = (full) => {
            if (!full) return;
            hr.lore = full.lore || full.blurb || hr.lore || '';
            const spells = Array.isArray(full.spells) ? full.spells : [];
            hr.skills = spells.map(spell => ({
                n: spell.name || '',
                i: spell.image && spell.image.full ? `${ddImgRoot()}/spell/${spell.image.full}` : '',
                d: stripHtml(spell.description || '').substring(0, 80)
            }));
            let skins = Array.isArray(full.skins) ? full.skins : [];
            if (!skins.length) skins = [{ name: 'default', num: 0 }];
            hr.skins = skins.map(skin => ({
                n: skin.name === 'default' ? hr.name : (skin.name || hr.name),
                num: skin.num != null ? skin.num : 0,
                t: `https://ddragon.leagueoflegends.com/cdn/img/champion/loading/${hr.id}_${skin.num}.jpg`,
                f: `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${hr.id}_${skin.num}.jpg`
            }));
            hr._ddragonDetailLoaded = true;
        };
        const localHref = new URL(`data/champion/${hr.id}.json`, window.location.href).href;
        const remoteUrl = `${ddDataBase()}/champion/${encodeURIComponent(hr.id)}.json`;
        try {
            const res = await fetchUrlWithCorsFallback(remoteUrl);
            const json = await res.json();
            applyFull(json.data && json.data[hr.id]);
        } catch (e) {
            try {
                const lr = await fetch(localHref, { cache: 'no-store' });
                if (lr.ok) {
                    const json = await lr.json();
                    applyFull(json.data && json.data[hr.id]);
                }
            } catch (_) { /* 忽略 */ }
        }
    }

                        renderOverview(hr, (hr.style / 5) * 100);

                    case 'skills':
                        pane.innerHTML = `<div class="skill-grid">${hr.skills.map(s => `

})();

(function() {
    const { showToast, stripHtml, commentBlock, panels, registerModule, getDataDragonVersion, setDataDragonVersion, fetchUrlWithCorsFallback, esc } = window.hexTech;

    const ddItemDataBase = () => `https://ddragon.leagueoflegends.com/cdn/${getDataDragonVersion()}/data/zh_CN`;
    const ddItemImg = () => `https://ddragon.leagueoflegends.com/cdn/${getDataDragonVersion()}/img`;

    let allItems = [];

    // 获取所有可购买物品（同源 data/item.json 优先，逻辑与 champion 一致）
    async function fetchItems() {
        const localHref = new URL('data/item.json', window.location.href).href;
        const applyVersion = (data) => { if (data && data.version) setDataDragonVersion(data.version); };
        try {
            const localRes = await fetch(localHref, { cache: 'no-store' });
            if (localRes.ok) {
                const data = await localRes.json();
                if (data && data.data && typeof data.data === 'object') {
                    applyVersion(data);
                    return Object.values(data.data).filter(item => item.gold.purchasable);
                }
            }
        } catch (_) { /* 继续 CDN */ }

        const itemUrl = `${ddItemDataBase()}/item.json`;
        let res;
        try {
            res = await fetchUrlWithCorsFallback(itemUrl);
        } catch (e) {
            const localRes2 = await fetch(localHref, { cache: 'no-store' });
            if (!localRes2.ok) throw e;
            const data = await localRes2.json();
            applyVersion(data);
            if (!data || !data.data) throw e;
            return Object.values(data.data).filter(item => item.gold.purchasable);
        }
        const data = await res.json();
        applyVersion(data);
        return Object.values(data.data).filter(item => item.gold.purchasable);
    }

    // 映射为前端数据结构
    function mapItem(item) {
        return {
            name: item.name,
            icon: `${ddItemImg()}/item/${item.image.full}`,
            desc: stripHtml(item.description).substring(0, 120),
            fullDesc: item.description,
            price: item.gold.total,
            id: item.image.full
        };
    }

    // 初始化：加载物品数据
    async function initItemModule() {
        try {
            const rawItems = await fetchItems();
            allItems = rawItems.map(mapItem);
            // 按价格排序（可选）
            allItems.sort((a, b) => a.price - b.price);
        } catch (e) {
            console.error('装备数据加载失败', e);
            showToast('装备数据加载失败');
        }
    }

    // 渲染物品列表
    function renderItems() {
        let h = `
            <div class="section-title"><span class="dot"></span>物品数据</div>
            <div style="font-size:0.72rem;color:var(--muted);margin:-14px 0 16px;">与英雄同源版本：<span style="color:var(--tech);">${esc(getDataDragonVersion())}</span></div>
            <div class="search-box"><input id="itemSearch" placeholder="搜索物品..."></div>
            <div class="icon-list" id="itemIconList">
                ${allItems.map(it => `
                    <div class="icon-item" data-name="${it.name}">
                        <img src="${it.icon}" class="icon-img" loading="lazy" onerror="this.style.display='none'">
                        <span class="label">${it.name}</span>
                    </div>
                `).join('')}
            </div>
            <div id="itemDetail"></div>`;
        panels.item.innerHTML = h;

        // 搜索过滤
        document.getElementById('itemSearch').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            document.querySelectorAll('#itemIconList .icon-item').forEach(el => {
                el.style.display = el.querySelector('.label').textContent.toLowerCase().includes(q) ? 'flex' : 'none';
            });
        });

        // 点击物品图标展示详情
        document.querySelectorAll('#itemIconList .icon-item').forEach(el => {
            el.addEventListener('click', () => {
                const it = allItems.find(x => x.name === el.dataset.name);
                if (!it) return;
                document.getElementById('itemDetail').innerHTML = `
                <div class="detail-card">
                    <div class="detail-content">
                        <div class="hero-header">
                            <div class="hero-icon"><img src="${it.icon}" style="width:100%;height:100%;"></div>
                            <div class="hero-name">${it.name}</div>
                            <span style="color:var(--gold);margin-left:auto;">💰 ${it.price}</span>
                        </div>
                        <div style="background:rgba(0,0,0,0.3);padding:16px;border-radius:6px;margin-bottom:12px;">${it.desc}</div>
                        <div style="border-top:1px solid var(--border);padding-top:12px;">
                            <strong>💬 ${it.name} 讨论</strong>
                            <form class="comment-form"><textarea placeholder="评价..."></textarea><button type="submit" class="btn-submit">发布</button></form>
                            <ul class="comment-list"></ul><div class="empty-comments" style="text-align:center;color:var(--muted);">暂无讨论</div>
                        </div>
                    </div>
                </div>`;
                commentBlock(document.getElementById('itemDetail'), `hex_item_${it.name}`);
            });
        });
    }

    // 注册模块
    registerModule('item',
        initItemModule,  // 异步初始化
        renderItems      // 首次切换到物品面板时渲染
    );
})();

        lanes.forEach(l => {

            label.className = `map-label ${l.type === 'neutral' ? 'map-neutral' : 'map-lane'}`;
            label.style.left = l.x + '%';
            label.style.top = l.y + '%';
            label.textContent = l.label;
            mapContainer.appendChild(label);
        });

        resources.forEach(r => {
            const m = document.createElement('div');
            m.className = `map-marker ${r.cls}`;
            m.style.left = r.x + '%';
            m.style.top = r.y + '%';
            m.dataset.icon = r.icon;
            m.title = r.name;
            m.addEventListener('click', () => showToast(r.name + ': ' + r.desc.replace(/\n/g, ' | ')));
            mapContainer.appendChild(m);
        });
    }

    registerModule('map',
        async function init() {},
        renderMap
    );
})();
// ==================== 云顶之弈模块 ====================
(function() {
    const { commentBlock, panels, registerModule } = window.hexTech;

    // 当前版本（静态，可后续更新）
    const TFT_VERSION = '13.10 (魔法乱斗)';

    // 羁绊示例数据
    const synergies = [
        { name: '决斗大师', icon: '⚔️', desc: '决斗大师们获得额外攻击速度，最多叠加8层。', levels: [2, 4, 6] },
        { name: '魔法师', icon: '🔮', desc: '魔法师们获得额外法术强度，并且可以双重施法。', levels: [3, 5, 7] },
        { name: '重骑兵', icon: '🐴', desc: '重骑兵获得伤害减免，并朝目标冲锋。', levels: [2, 4, 6] },
        { name: '狙神', icon: '🏹', desc: '狙神与目标距离越远，伤害越高。', levels: [2, 4] },
        { name: '秘术师', icon: '✨', desc: '全队获得魔法抗性。', levels: [2, 3, 4] }
    ];

    // 棋子示例数据（静态，可扩展）
    const champions = [
        { name: '亚索', cost: 1, icon: '⚔️', trait: ['决斗大师', '浪人'], skill: '钢铁风暴：对前方扇形区域造成伤害并获得护盾。' },
        { name: '拉克丝', cost: 2, icon: '✨', trait: ['魔法师', '光明'], skill: '光之束缚：向最远敌人发射光球，眩晕并造成伤害。' },
        { name: '赵信', cost: 3, icon: '🛡️', trait: ['决斗大师', '神盾使'], skill: '三重爪击：击飞目标并造成额外伤害。' },
        { name: '金克丝', cost: 4, icon: '💥', trait: ['狙神', '宿敌'], skill: '鱼骨头飞弹：对随机敌人发射火箭，造成范围伤害。' },
        { name: '迦娜', cost: 3, icon: '💨', trait: ['秘术师', '风女'], skill: '复苏季风：治疗全体友军并击退敌人。' }
    ];

    // 渲染云顶之弈面板
    function renderTFT() {
        let h = `
            <div class="section-title"><span class="dot"></span>云顶之弈 · <span style="font-size:0.8rem;color:var(--muted);">${TFT_VERSION}</span></div>
            
            <!-- 羁绊选择 -->
            <div class="tabs-row" id="tftTabs">
                <button class="tab-btn active" data-tft="champions">⚔️ 棋子</button>
                <button class="tab-btn" data-tft="synergies">🧩 羁绊</button>
            </div>

            <div id="tftContent"></div>
        `;
        panels.tft.innerHTML = h;

        // 默认显示棋子
        renderChampions();

        // 切换羁绊/棋子
        document.querySelectorAll('#tftTabs .tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#tftTabs .tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                if (this.dataset.tft === 'champions') renderChampions();
                else renderSynergies();
            });
        });
    }

    // 渲染棋子列表
    function renderChampions() {
        const container = document.getElementById('tftContent');
        if (!container) return;
        container.innerHTML = `
            <div class="search-box"><input id="championSearch" placeholder="搜索棋子..."></div>
            <div class="icon-list" id="championList">
                ${champions.map(c => `
                    <div class="icon-item" data-name="${c.name}">
                        <span class="emoji">${c.icon}</span>
                        <span class="label">${c.name} · ${c.cost}💰</span>
                    </div>
                `).join('')}
            </div>
            <div id="championDetail"></div>
        `;

        // 搜索
        document.getElementById('championSearch').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            document.querySelectorAll('#championList .icon-item').forEach(el => {
                el.style.display = el.querySelector('.label').textContent.toLowerCase().includes(q) ? 'flex' : 'none';
            });
        });

        // 点击显示详情
        document.querySelectorAll('#championList .icon-item').forEach(el => {
            el.addEventListener('click', () => {
                const champ = champions.find(c => c.name === el.dataset.name);
                if (!champ) return;
                document.getElementById('championDetail').innerHTML = `
                <div class="detail-card">
                    <div class="detail-content">
                        <div class="hero-header">
                            <div class="hero-icon">${champ.icon}</div>
                            <div class="hero-name">${champ.name}</div>
                            <span style="color:var(--gold);margin-left:8px;">💰 ${champ.cost}</span>
                        </div>
                        <div style="background:rgba(0,0,0,0.3);padding:16px;border-radius:6px;margin-bottom:12px;">
                            <div class="attr-label">羁绊</div>
                            <div>${champ.trait.join(' / ')}</div>
                        </div>
                        <div style="background:rgba(0,0,0,0.3);padding:16px;border-radius:6px;margin-bottom:12px;">
                            <div class="attr-label">技能</div>
                            <div>${champ.skill}</div>
                        </div>
                        <div style="border-top:1px solid var(--border);padding-top:12px;">
                            <strong>💬 ${champ.name} 讨论</strong>
                            <form class="comment-form"><textarea placeholder="评价..."></textarea><button type="submit" class="btn-submit">发布</button></form>
                            <ul class="comment-list"></ul><div class="empty-comments" style="text-align:center;color:var(--muted);">暂无讨论</div>
                        </div>
                    </div>
                </div>`;
                commentBlock(document.getElementById('championDetail'), `hex_tft_${champ.name}`);
            });
        });
    }

    // 渲染羁绊列表
    function renderSynergies() {
        const container = document.getElementById('tftContent');
        if (!container) return;
        container.innerHTML = `
            <div class="rune-grid">
                ${synergies.map(s => `
                    <div class="rune-item" style="flex-direction:column;align-items:flex-start;gap:4px;">
                        <span style="font-size:1.2rem;">${s.icon} <strong>${s.name}</strong></span>
                        <span style="color:var(--muted);font-size:0.75rem;">${s.desc}</span>
                        <span style="color:var(--tech);font-size:0.7rem;">羁绊人数：${s.levels.join(' / ')}</span>
                    </div>
                `).join('')}
            </div>
        `;
    }

    // 注册模块：无异步初始化，默认显示即将开启（已在 HTML 中有静态内容，但模块渲染会覆盖）
    registerModule('tft',
        async function init() {},
        renderTFT
    );

    window.hexTech.init();
})();
    </script>
</body>
